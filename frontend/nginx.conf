server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location = /api/health/products { proxy_pass http://products:8000/health; }
  location = /api/health/customers { proxy_pass http://customers:8000/health; }
  location = /api/health/loans { proxy_pass http://loans:8000/health; }
  location = /api/health/inventory { proxy_pass http://inventory:8000/health; }
  location /api/auth/ { proxy_pass http://customers:8000/auth/; }
  location /api/products { proxy_pass http://products:8000/products; }
  location /api/customers { proxy_pass http://customers:8000/customers; }
  location /api/inventory { proxy_pass http://inventory:8000/inventory; }
  location /api/prestamos { proxy_pass http://loans:8000/prestamos; }
  location /api/modelo { proxy_pass http://loans:8000/modelo; }
  location = /api/drift { proxy_pass http://loans:8000/drift; }
  location / { try_files $uri $uri/ /index.html; }
}
